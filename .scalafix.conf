rules = [
  OrganizeImports,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoAutoTupling,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused
]

# Disable old Scala 2 syntax patterns
DisableSyntax {
  noVars = false           # Allow vars when necessary (e.g., mutable state in ZIO)
  noThrows = false         # Allow throws - sometimes needed for fail-fast initialization
  noNulls = false          # Allow nulls - needed for Java interop and UUID checks
  noReturns = false        # Allow early returns - useful in parsers
  noWhileLoops = false     # Sometimes needed in performance-critical code
  noAsInstanceOf = false   # Sometimes necessary with cross-compilation
  noIsInstanceOf = false   # Sometimes necessary with pattern matching
  noXml = true             # Prevent XML literals
  noDefaultArgs = false    # Allow default arguments
  noFinalVal = true        # final val is redundant
  noFinalize = true        # Prevent finalize
  noValPatterns = false    # Allow val patterns
  noUniversalEquality = false
  regex = []
}

# Organize imports for Scala 3
OrganizeImports {
  targetDialect = Scala3

  # Group imports logically
  groups = [
    "re:javax?\\.",                    # Java/JavaX standard library
    "scala.",                          # Scala standard library
    "re:zio\\.(json|prelude|test)\\.", # ZIO core libraries
    "zio.",                            # Other ZIO libraries
    "re:sttp\\.(tapir|client)\\.",     # Tapir and STTP
    "com.edoframework.",               # Edo Framework
    "*"                                # Everything else
  ]

  # Remove unused imports (critical for Scala 3)
  removeUnused = true

  # Handle implicits/givens
  groupedImports = Merge
  groupExplicitlyImportedImplicitsSeparately = false

  # Scala 3 specific settings
  importSelectorsOrder = SymbolsFirst
  importsOrder = SymbolsFirst

  # Preserve specific imports
  coalesceToWildcardImportThreshold = 3  # Convert to wildcard after 3 imports from same package
  expandRelative = true

  # Given/using imports (Scala 3)
  preset = INTELLIJ_2020_3
}

# Remove unused imports - critical for Scala 3
RemoveUnused {
  imports = false     # OrganizeImports.removeUnused does it; scalafix refuses both together
  privates = true
  locals = true
  patternvars = true
}

# Prevent common ZIO mistakes
NoAutoTupling.enabled = true

# Prevent val in for-comprehension (use <- instead)
NoValInForComprehension.enabled = true

# Remove procedure syntax (not valid in Scala 3)
ProcedureSyntax.enabled = true

# Prevent leaking implicit class val
LeakingImplicitClassVal.enabled = true