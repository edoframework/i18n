name: Taihei Tsuji CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only: CI builds and tests, it publishes nothing.
permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  # Everything resolves from Maven Central: the build needs no credentials.

jobs:
  validate:
    name: Validate (Format, Lint, Compile, Test, MiMa — JVM & JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The job only reads; the token need not stay in .git/config.
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node (for Scala.js tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Mill and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/mill
            ~/.ivy2/cache
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      # A symlink or a submodule is a tracked, clean entry to git, but Mill follows a symlink into
      # the published jars, wherever it points, and a filter (Git LFS) checks out other bytes than
      # the reviewed ones. The release refuses them (make's STRAY_GUARD); a pull request that adds
      # one fails here, visibly. bash with pipefail, so a failing git cannot pass as "none found".
      - name: Refuse symlinks, submodules and filtered files
        shell: bash
        run: |
          git ls-files -s > "$RUNNER_TEMP/entries"
          links="$(awk '$1 != "100644" && $1 != "100755"' "$RUNNER_TEMP/entries")"
          if [ -n "$links" ]; then echo "::error::tracked entries that are not regular files:"; echo "$links"; exit 1; fi
          filtered="$(git ls-files | git check-attr --stdin filter | awk '!/: filter: unspecified$/')"
          if [ -n "$filtered" ]; then echo "::error::files with a git filter:"; echo "$filtered"; exit 1; fi

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Check linting (scalafix)
        run: ./mill __.fix --check

      - name: Compile all modules (JVM + JS)
        run: ./mill __.compile

      - name: Run all tests (JVM + JS)
        run: ./mill __.test.testForked

      # Against the newest v-tag before HEAD (fetch-depth 0 brings the tags), as make validate does.
      - name: Check binary compatibility (MiMa)
        run: make mima
