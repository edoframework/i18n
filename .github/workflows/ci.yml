name: Edo Framework i18n CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '20'
  # Everything resolves from Maven Central: the build needs no credentials.

jobs:
  validate:
    name: Validate (Format, Lint, Compile, Test — JVM & JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node (for Scala.js tests)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Mill and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mill
            ~/.ivy2/cache
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Check linting (scalafix)
        run: ./mill __.fix --check

      - name: Compile all modules (JVM + JS)
        run: ./mill __.compile

      - name: Run all tests (JVM + JS)
        run: ./mill __.test.testForked
